{{- $fullName := include "t3codes.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "t3codes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ $fullName }}-headless
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  selector:
    matchLabels:
      {{- include "t3codes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "t3codes.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "t3codes.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.spreadAcrossNodes }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "t3codes.selectorLabels" . | nindent 18 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Mounting the volume at /nix would shadow the baked store, and with it
      # every binary in /bin, t3 and nix included. Copy the store across first.
      # Later starts of the same image skip it; watch the first with
      #   kubectl logs {{ $fullName }}-0 -c seed-nix -f
      initContainers:
        - name: seed-nix
          image: {{ include "t3codes.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/seed-nix"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /seed
              subPath: nix
      containers:
        - name: t3node
          image: {{ include "t3codes.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # A first start runs database migrations behind the listener, so the
          # startup probe is what absorbs that rather than a liveness restart.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # One volume, three subPaths. The Nix store has to keep its real
            # location: a store mounted anywhere else is a diverted store, which
            # nix can only build in through a chroot this pod may not create.
            - name: data
              mountPath: /nix
              subPath: nix
            - name: data
              mountPath: /home/agent
              subPath: home
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
