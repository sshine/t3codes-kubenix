{{- $fullName := include "t3codes.fullname" . -}}
{{- $routes := .Values.routes -}}
{{- $ordinals := keys $routes | sortAlpha -}}
{{- range $i, $ordinal := $ordinals }}
{{- $host := index $routes $ordinal }}
# A node reached straight from a browser, on T3 Code's own bearer auth. Nothing
# else stands in front of this hostname, which is the point: the client talks to
# a secondary environment cross-origin, where it sends a bearer token and no
# cookies, so a cookie proxy here would answer with a redirect that the browser
# discards.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ $ordinal }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "t3codes.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}-{{ $ordinal }}
          port: {{ $.Values.service.port }}
{{ if lt (add1 $i) (len $ordinals) }}---{{ end }}
{{- end }}
