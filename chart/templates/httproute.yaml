{{- $fullName := include "t3codes.fullname" . -}}
{{- $first := true -}}
{{- range $ordinal, $host := .Values.routes }}
{{- if not $first }}---{{ end }}{{ $first = false }}
# A node reached straight from a browser, on T3 Code's own bearer auth. Nothing
# else gates this hostname, which is the point: the client talks to a secondary
# environment cross-origin, where it sends a bearer token and no cookies, so a
# cookie proxy in front would redirect those calls and the browser would drop
# them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ $ordinal }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "t3codes.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}-{{ $ordinal }}
          port: {{ $.Values.service.port }}
{{- end }}
